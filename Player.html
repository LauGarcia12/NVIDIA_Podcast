<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NVIDIA Physical AI Podcast Player</title>
<style>
    body {
      margin: 0;
      padding: 0;
      background-color: #141414;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }
    .carousel-container {
      max-width: 100%;
      margin: 0 auto;
      background: #141414;
      padding: 24px;
      box-sizing: border-box;
      position: relative;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h2 {
      margin: 0;
      font-size: 1.15rem;
      color: #76b900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(118, 185, 0, 0.3);
    }
    .header p {
      margin: 5px 0 0 0;
      font-size: 0.8rem;
      color: #888888;
    }
    .track-title {
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
      color: #ffffff;
      min-height: 24px;
    }

    /* Player Interface Controls */
    .player-interface {
      background: #0d0d0d;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #222222;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .player-interface audio {
      width: 100%;
    }

    /* Bottom Slider Navigation */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #222222;
      padding-top: 15px;
    }
    .nav-btn {
      background: #1e1e1e;
      color: #76b900;
      border: 1px solid #76b900;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      background: #76b900;
      color: #0d0d0d;
      box-shadow: 0 0 12px rgba(118, 185, 0, 0.6);
    }
    .indicators {
      display: flex;
      gap: 10px;
    }
    .dot {
      width: 10px;
      height: 10px;
      background: #333333;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .dot.active {
      background: #76b900;
      box-shadow: 0 0 8px #76b900;
    }
</style>
</head>
<body>

  <div class="carousel-container">
<div class="header">
<h2>NVIDIA Physical AI Podcast</h2>
<p>Interactive Learning Path Carousel</p>
</div>

    <!-- Active Track Title -->
<div class="track-title" id="track-title">Loading track...</div>

    <!-- Central Audio Player (native browser controls) -->
<div class="player-interface">
<audio id="audio-player" controls preload="metadata"></audio>
</div>

    <!-- Carousel Nav controls -->
<div class="controls">
<button class="nav-btn" onclick="prevSlide()" aria-label="Previous Slide">&#10094;</button>
<div class="indicators">
<span class="dot active" onclick="setSlide(0)"></span>
<span class="dot" onclick="setSlide(1)"></span>
<span class="dot" onclick="setSlide(2)"></span>
</div>
<button class="nav-btn" onclick="nextSlide()" aria-label="Next Slide">&#10095;</button>
</div>
</div>

  <script>
    const audio = document.getElementById('audio-player');
    const trackTitleEl = document.getElementById('track-title');
    const dots = document.querySelectorAll('.dot');

    let currentIdx = 0;

    // Relative paths: served via GitHub Pages as plain static files (no
    // SharePoint blob-sandboxing), so a bare filename in the same folder
    // as this document resolves normally.
    const tracks = [
      {
        title: "Chapter 1: Introduction to Physical AI",
        src: "Chapter1.mp3"
      },
      {
        title: "Chapter 2: Deep Dive & Architecture",
        src: "Chapter2.mp3"
      },
      {
        title: "Chapter 3: Future Horizons & Deployment",
        src: "Chapter3.mp3"
      }
    ];

    function loadTrack(index) {
      const wasPlaying = !audio.paused && !audio.ended;
      currentIdx = index;
      const track = tracks[index];

      // Update Title and dot indicators
      trackTitleEl.textContent = track.title;
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });

      // Update audio source; native controls handle play/pause/seek/volume
      audio.src = track.src;
      audio.load();

      if (wasPlaying) {
        audio.play().catch(e => console.log("Play failed: ", e));
      }
    }

    // Slide navigation
    function nextSlide() {
      let index = (currentIdx + 1) % tracks.length;
      loadTrack(index);
    }

    function prevSlide() {
      let index = (currentIdx - 1 + tracks.length) % tracks.length;
      loadTrack(index);
    }

    function setSlide(index) {
      loadTrack(index);
    }

    // Automatically load Chapter 1 on startup
    window.addEventListener('DOMContentLoaded', () => {
      loadTrack(0);
    });
</script>
</body>
</html>
