<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NVIDIA Physical AI Podcast Player</title>
<style>
  :root {
    --nvidia-green: #76b900;
    --nvidia-green-glow: rgba(118, 185, 0, 0.35);
    --bg-deep: #0a0a0a;
    --border: #232323;
    --text-dim: #8a8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at 50% 0%, #1a1f14 0%, var(--bg-deep) 60%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
    overflow: hidden;
  }
  .carousel-container {
    max-width: 460px;
    margin: 0 auto;
    background: linear-gradient(160deg, #141414 0%, #0c0c0c 100%);
    padding: 28px 24px;
    box-sizing: border-box;
    position: relative;
    border-radius: 18px;
    border: 1px solid var(--border);
    box-shadow: 0 0 0 1px rgba(118, 185, 0, 0.05), 0 20px 40px -20px rgba(0, 0, 0, 0.8);
  }
  .carousel-container::before {
    content: "";
    position: absolute;
    top: 0; left: 12%; right: 12%;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--nvidia-green), transparent);
    opacity: 0.7;
  }
  .header {
    text-align: center;
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .header-icon {
    width: 30px;
    height: 30px;
    color: var(--nvidia-green);
    filter: drop-shadow(0 0 6px var(--nvidia-green-glow));
  }
  .header h2 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--nvidia-green);
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 12px var(--nvidia-green-glow);
  }
  .header p {
    margin: 0;
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .track-title {
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    margin-bottom: 16px;
    color: #ffffff;
    min-height: 24px;
    transition: opacity 0.25s ease;
  }

  /* Now-playing equalizer */
  .equalizer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 4px;
    height: 18px;
    margin-bottom: 14px;
  }
  .equalizer span {
    width: 3px;
    background: var(--nvidia-green);
    border-radius: 2px;
    height: 4px;
    opacity: 0.35;
    transition: opacity 0.3s ease;
  }
  .equalizer.playing span {
    opacity: 1;
    animation: bounce 0.9s ease-in-out infinite;
  }
  .equalizer.playing span:nth-child(1) { animation-delay: 0s; }
  .equalizer.playing span:nth-child(2) { animation-delay: 0.15s; }
  .equalizer.playing span:nth-child(3) { animation-delay: 0.3s; }
  .equalizer.playing span:nth-child(4) { animation-delay: 0.45s; }
  .equalizer.playing span:nth-child(5) { animation-delay: 0.1s; }
  @keyframes bounce {
    0%, 100% { height: 4px; }
    50% { height: 18px; }
  }

  /* Player Interface Controls */
  .player-interface {
    background: #0d0d0d;
    border-radius: 14px;
    padding: 18px;
    border: 1px solid var(--border);
    margin-bottom: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
  }
  .player-interface audio {
    width: 100%;
    accent-color: var(--nvidia-green);
    color-scheme: dark;
  }

  /* Bottom Slider Navigation */
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .nav-btn {
    background: #1a1a1a;
    color: var(--nvidia-green);
    border: 1px solid var(--nvidia-green);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  .nav-btn:hover {
    background: var(--nvidia-green);
    color: #0d0d0d;
    box-shadow: 0 0 14px var(--nvidia-green-glow);
    transform: scale(1.05);
  }
  .indicators {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .dot {
    width: 8px;
    height: 8px;
    background: #333333;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .dot.active {
    width: 22px;
    border-radius: 4px;
    background: var(--nvidia-green);
    box-shadow: 0 0 10px var(--nvidia-green-glow);
  }
</style>
</head>
<body>

  <div class="carousel-container">
<div class="header">
<svg class="header-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M12 2a4 4 0 0 0-4 4v6a4 4 0 0 0 8 0V6a4 4 0 0 0-4-4Z" stroke="currentColor" stroke-width="1.6"/>
  <path d="M5 11v1a7 7 0 0 0 14 0v-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M12 19v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>
<h2>NVIDIA Physical AI Podcast</h2>
<p>Moment for Robotics</p>
</div>

    <!-- Active Track Title -->
<div class="track-title" id="track-title">Loading track...</div>

    <!-- Now-playing equalizer -->
<div class="equalizer" id="equalizer">
<span></span><span></span><span></span><span></span><span></span>
</div>

    <!-- Central Audio Player (native browser controls) -->
<div class="player-interface">
<audio id="audio-player" controls preload="metadata"></audio>
</div>

    <!-- Carousel Nav controls -->
<div class="controls">
<button class="nav-btn" onclick="prevSlide()" aria-label="Previous Slide">&#10094;</button>
<div class="indicators">
<span class="dot active" onclick="setSlide(0)"></span>
<span class="dot" onclick="setSlide(1)"></span>
<span class="dot" onclick="setSlide(2)"></span>
</div>
<button class="nav-btn" onclick="nextSlide()" aria-label="Next Slide">&#10095;</button>
</div>
</div>

  <script>
    const audio = document.getElementById('audio-player');
    const trackTitleEl = document.getElementById('track-title');
    const dots = document.querySelectorAll('.dot');
    const equalizer = document.getElementById('equalizer');

    let currentIdx = 0;

    // Relative paths: served via GitHub Pages as plain static files (no
    // SharePoint blob-sandboxing), so a bare filename in the same folder
    // as this document resolves normally.
    const tracks = [
      {
        title: "Chapter 1: Robots that rewrite their own code",
        src: "Chapter1.mp3"
      },
      {
        title: "Chapter 2: The big bang of physical AI",
        src: "Chapter2.mp3"
      },
      {
        title: "Chapter 3: How Synthetic Data Builds Physical AI",
        src: "Chapter3.mp3"
      }
    ];

    function loadTrack(index) {
      const wasPlaying = !audio.paused && !audio.ended;
      currentIdx = index;
      const track = tracks[index];

      // Fade the title out/in on track change
      trackTitleEl.style.opacity = 0;
      setTimeout(() => {
        trackTitleEl.textContent = track.title;
        trackTitleEl.style.opacity = 1;
      }, 150);

      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });

      // Update audio source; native controls handle play/pause/seek/volume
      audio.src = track.src;
      audio.load();

      if (wasPlaying) {
        audio.play().catch(e => console.log("Play failed: ", e));
      }
    }

    // Equalizer only animates while audio is actually playing
    audio.addEventListener('play', () => equalizer.classList.add('playing'));
    audio.addEventListener('pause', () => equalizer.classList.remove('playing'));
    audio.addEventListener('ended', () => equalizer.classList.remove('playing'));

    // Slide navigation
    function nextSlide() {
      let index = (currentIdx + 1) % tracks.length;
      loadTrack(index);
    }

    function prevSlide() {
      let index = (currentIdx - 1 + tracks.length) % tracks.length;
      loadTrack(index);
    }

    function setSlide(index) {
      loadTrack(index);
    }

    // Automatically load Chapter 1 on startup
    window.addEventListener('DOMContentLoaded', () => {
      loadTrack(0);
    });
</script>
</body>
</html>
